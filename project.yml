name: Cadence
options:
  bundleIdPrefix: net.mcinnis
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Cadence
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    DEVELOPMENT_TEAM: ""

targets:
  Cadence-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Cadence
      - path: Resources/iOS
        optional: true
      # Widget views are shared with the main app so the Widget Gallery preview
      # (launched with --widget-preview=...) can render them at real dimensions
      # without re-implementing the SwiftUI.
      - path: Sources/CadenceWidget/WidgetEntry.swift
      - path: Sources/CadenceWidget/CompleteTaskFromWidgetIntent.swift
      - path: Sources/CadenceWidget/Views
    dependencies:
      - target: CadenceWidget
        embed: true
    settings:
      base:
        PRODUCT_NAME: Cadence
        PRODUCT_BUNDLE_IDENTIFIER: net.mcinnis.cadence
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Sources/Cadence/Cadence.entitlements

  Cadence-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Cadence
      - path: Resources/macOS
        optional: true
    settings:
      base:
        PRODUCT_NAME: Cadence
        PRODUCT_BUNDLE_IDENTIFIER: net.mcinnis.cadence
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""

  CadenceWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/CadenceWidget
      # Shared source files (compiled into both targets). See SharedContainer.swift
      # for the contract — both targets must agree on schema + App Group ID.
      - path: Sources/Cadence/Models/Models.swift
      - path: Sources/Cadence/Models/ListPalette.swift
      - path: Sources/Cadence/Tokens.swift
      - path: Sources/Cadence/Util/SharedContainer.swift
    settings:
      base:
        PRODUCT_NAME: CadenceWidget
        PRODUCT_BUNDLE_IDENTIFIER: net.mcinnis.cadence.widget
        INFOPLIST_KEY_CFBundleDisplayName: Cadence
        SKIP_INSTALL: NO
        CODE_SIGN_ENTITLEMENTS: Sources/CadenceWidget/CadenceWidget.entitlements
    info:
      path: Sources/CadenceWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
