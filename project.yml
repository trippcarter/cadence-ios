name: Cadence
options:
  bundleIdPrefix: net.mcinnis
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

packages:
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS
    from: "1.7.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "30"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Cadence
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    # CloudKit requires real signing — set to your paid Apple Developer team
    # ID (10-char string from developer.apple.com → Membership). Once set,
    # all three targets (iOS, macOS, widget) auto-sign with it.
    DEVELOPMENT_TEAM: "756CM5YLW6"
    CODE_SIGN_STYLE: Automatic

targets:
  Cadence-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Cadence
      - path: Resources/iOS
        optional: true
      # Widget views are shared with the main app so the Widget Gallery preview
      # (launched with --widget-preview=...) can render them at real dimensions
      # without re-implementing the SwiftUI.
      - path: Sources/CadenceWidget/WidgetEntry.swift
      - path: Sources/CadenceWidget/CompleteTaskFromWidgetIntent.swift
      - path: Sources/CadenceWidget/Views
    dependencies:
      - target: CadenceWidget
        embed: true
      - target: CadenceCapture
        embed: true
      - target: CadenceWatch
        embed: true
        codeSign: true
      - package: AppAuth
        product: AppAuth
    settings:
      base:
        PRODUCT_NAME: Cadence
        PRODUCT_BUNDLE_IDENTIFIER: net.mcinnis.cadence
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Build 24: list each alternate icon asset name so Xcode compiles
        # them into the bundle and CFBundleAlternateIcons knows to wire
        # them up via setAlternateIconName(_:).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "Mint Warm Ocean Forest Mono Outdoors Family"
        CODE_SIGN_ENTITLEMENTS: Sources/Cadence/Cadence.entitlements
    info:
      path: Sources/Cadence/Info.plist
      properties:
        CFBundleDisplayName: Cadence
        # Pull version + build from the unified `settings.base` block above so
        # CURRENT_PROJECT_VERSION / MARKETING_VERSION are the single source of
        # truth. xcodegen would otherwise default to "1" / "1.0".
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Phase 7: we only use OS-provided crypto, so we qualify for the
        # export-compliance exemption (avoids a Yes/No prompt on every upload).
        ITSAppUsesNonExemptEncryption: false
        # Build 22: imported tasks from Apple Reminders need read access.
        # Description shown in the iOS permission dialog.
        NSRemindersFullAccessUsageDescription: Cadence imports your existing Apple Reminders lists so you don't have to retype them.
        NSRemindersUsageDescription: Cadence imports your existing Apple Reminders lists so you don't have to retype them.
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: ""
        # CloudKit silent push wakeups need the remote-notification mode.
        UIBackgroundModes:
          - remote-notification
        # Build 24: alternate app icon registration. Each key maps to the
        # icon file name as Xcode compiles it from the asset catalog
        # (ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES). Tapping a tile
        # in Settings → App icon calls
        # UIApplication.shared.setAlternateIconName(key) which iOS
        # validates against this section.
        CFBundleIcons:
          CFBundleAlternateIcons:
            Mint:
              CFBundleIconFiles:
                - Mint
              UIPrerenderedIcon: false
            Warm:
              CFBundleIconFiles:
                - Warm
              UIPrerenderedIcon: false
            Ocean:
              CFBundleIconFiles:
                - Ocean
              UIPrerenderedIcon: false
            Forest:
              CFBundleIconFiles:
                - Forest
              UIPrerenderedIcon: false
            Mono:
              CFBundleIconFiles:
                - Mono
              UIPrerenderedIcon: false
            Outdoors:
              CFBundleIconFiles:
                - Outdoors
              UIPrerenderedIcon: false
            Family:
              CFBundleIconFiles:
                - Family
              UIPrerenderedIcon: false
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: net.mcinnis.cadence.google-oauth
            CFBundleURLSchemes:
              - com.googleusercontent.apps.936849433688-9fa47d098o9ik1cq7ku2lre7su7v9091

  Cadence-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Cadence
      - path: Resources/macOS
        optional: true
    settings:
      base:
        PRODUCT_NAME: Cadence
        PRODUCT_BUNDLE_IDENTIFIER: net.mcinnis.cadence
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""

  CadenceWatch:
    # Build 21 (resumed): native watchOS 10+ companion app. Single-target
    # architecture (Apple killed the old "Watch App + Watch Extension"
    # two-target pattern in watchOS 10). Shares the same SwiftData @Model
    # files + CloudKit container ID with iOS so tasks appear identically
    # on both devices.
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/CadenceWatch
      # Shared model + container + tokens (same pattern as widget +
      # capture extension targets).
      - path: Sources/Cadence/Models/Models.swift
      - path: Sources/Cadence/Models/ListPalette.swift
      - path: Sources/Cadence/Models/CachedEvent.swift
      - path: Sources/Cadence/Models/CalendarConfig.swift
      - path: Sources/Cadence/Models/ConnectedAccount.swift
      - path: Sources/Cadence/Models/RecurrenceRule.swift
      - path: Sources/Cadence/Models/Activity.swift
      - path: Sources/Cadence/Models/Household.swift
      - path: Sources/Cadence/Models/FocusSession.swift
      - path: Sources/Cadence/Models/HabitCompletion.swift
      - path: Sources/Cadence/Models/DailyReview.swift
      - path: Sources/Cadence/Tokens.swift
      - path: Sources/Cadence/Theme/AppTheme.swift
      - path: Sources/Cadence/Util/SharedContainer.swift
      - path: Sources/Cadence/Util/Haptics.swift
    settings:
      base:
        # PRODUCT_NAME differs from the iOS target's "Cadence" to avoid the
        # "Multiple commands produce Cadence.app" build collision when both
        # binaries land in the same Applications/ intermediate dir during
        # archive. The user-visible display on the wrist comes from
        # CFBundleDisplayName below (= "Cadence"), so the rename is invisible.
        PRODUCT_NAME: CadenceWatchApp
        # Apple's modern convention: parent bundle id + ".watchkitapp"
        # → the system pairs the Watch app with the iPhone app automatically.
        PRODUCT_BUNDLE_IDENTIFIER: net.mcinnis.cadence.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        # Build 30 fix: extensions + Watch app must be SKIP_INSTALL=YES so
        # they're only embedded inside Cadence.app, not also dropped at
        # the archive's top-level Applications/ alongside the iOS app.
        # Without this, IDEDistribution sees two top-level apps and fails
        # to enumerate distribution methods → exportArchive errors out.
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Sources/CadenceWatch/CadenceWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/CadenceWatch/Info.plist
      properties:
        CFBundleDisplayName: Cadence
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # watchOS 10+ single-target marker — required.
        WKApplication: true
        # Links to iPhone parent so installing the iPhone app prompts the
        # paired Watch to auto-install.
        WKCompanionAppBundleIdentifier: net.mcinnis.cadence
        # Won't run untethered — keeps the entitlement surface tighter.
        WKRunsIndependentlyOfCompanionApp: false
        UIBackgroundModes:
          - remote-notification
        # Belt-and-suspenders for App Store validation. The asset
        # catalog (Assets.xcassets/AppIcon.appiconset with watch-idiom
        # entries) is the actual source of icons; CFBundleIcons here
        # makes Apple's validator + altool happy by explicitly naming
        # AppIcon as the primary icon.
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
            CFBundleIconName: AppIcon
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
            CFBundleIconName: AppIcon

  CadenceCapture:
    # Build 22: iOS Share Sheet extension. Lets the user select text /
    # URLs / highlighted content in any app, tap Share → Cadence, and
    # save the selection as a new task without leaving the source app.
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/CadenceCapture
      # Shared SwiftData + design tokens (same pattern as widget).
      - path: Sources/Cadence/Models/Models.swift
      - path: Sources/Cadence/Models/ListPalette.swift
      - path: Sources/Cadence/Models/CachedEvent.swift
      - path: Sources/Cadence/Models/CalendarConfig.swift
      - path: Sources/Cadence/Models/ConnectedAccount.swift
      - path: Sources/Cadence/Models/RecurrenceRule.swift
      - path: Sources/Cadence/Models/Activity.swift
      - path: Sources/Cadence/Models/Household.swift
      - path: Sources/Cadence/Models/FocusSession.swift
      - path: Sources/Cadence/Models/HabitCompletion.swift
      - path: Sources/Cadence/Models/DailyReview.swift
      - path: Sources/Cadence/Tokens.swift
      - path: Sources/Cadence/Theme/AppTheme.swift
      - path: Sources/Cadence/Util/SharedContainer.swift
      - path: Sources/Cadence/Util/Haptics.swift
    settings:
      base:
        PRODUCT_NAME: CadenceCapture
        PRODUCT_BUNDLE_IDENTIFIER: net.mcinnis.cadence.share
        INFOPLIST_KEY_CFBundleDisplayName: Save to Cadence
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Sources/CadenceCapture/CadenceCapture.entitlements
    info:
      path: Sources/CadenceCapture/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          # Use a SwiftUI-hosted view controller rather than the legacy
          # SLComposeServiceViewController so the UI matches the rest of
          # Cadence.
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1

  CadenceWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/CadenceWidget
      # Shared source files (compiled into both targets). See SharedContainer.swift
      # for the contract — both targets must agree on schema + App Group ID.
      - path: Sources/Cadence/Models/Models.swift
      - path: Sources/Cadence/Models/ListPalette.swift
      - path: Sources/Cadence/Models/CachedEvent.swift
      - path: Sources/Cadence/Models/CalendarConfig.swift
      - path: Sources/Cadence/Models/ConnectedAccount.swift
      - path: Sources/Cadence/Models/RecurrenceRule.swift
      - path: Sources/Cadence/Models/Activity.swift
      - path: Sources/Cadence/Models/Household.swift
      - path: Sources/Cadence/Models/FocusSession.swift
      - path: Sources/Cadence/Models/HabitCompletion.swift
      - path: Sources/Cadence/Models/DailyReview.swift
      - path: Sources/Cadence/Tokens.swift
      - path: Sources/Cadence/Theme/AppTheme.swift
      - path: Sources/Cadence/Util/SharedContainer.swift
    settings:
      base:
        PRODUCT_NAME: CadenceWidget
        PRODUCT_BUNDLE_IDENTIFIER: net.mcinnis.cadence.widget
        INFOPLIST_KEY_CFBundleDisplayName: Cadence
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Sources/CadenceWidget/CadenceWidget.entitlements
    info:
      path: Sources/CadenceWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
